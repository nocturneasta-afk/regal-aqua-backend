<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Regal Aqua</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="storage-encryption.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f3d 50%, #1a2d4d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            background: linear-gradient(145deg, #0f1f3d 0%, #1a2d4d 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .logo-section h1 {
            color: #D4AF37;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        
        .logo-section p {
            color: #8892b0;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .auth-title {
            color: #D4AF37;
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .auth-subtitle {
            color: #8892b0;
            text-align: center;
            margin-bottom: 28px;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            color: #D4AF37;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .required {
            color: #ef4444;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.08);
        }
        
        .form-group input::placeholder {
            color: #8892b0;
            opacity: 0.5;
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%);
            color: #0a1628;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8892b0;
            font-size: 13px;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(212, 175, 55, 0.2);
        }
        
        .divider span {
            padding: 0 12px;
        }
        
        .btn-google {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-google:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.5);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #8892b0;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 600;
        }
        
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0a1628;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-section">
            <h1>REGAL AQUA</h1>
            <p>Premium Purified Water</p>
        </div>
        
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join us today</p>
        
        <div class="alert alert-error" id="errorMsg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span id="errorText"></span>
        </div>
        
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="signupName" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="signupEmail" required placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="signupPhone" required placeholder="0712345678" pattern="[0-9]{10}">
                <p style="color: #8892b0; font-size: 12px; margin-top: 4px;">We'll use this for M-Pesa payment prompts</p>
            </div>
            
            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" id="signupPassword" required placeholder="Min 6 characters" minlength="6">
            </div>
            
            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" id="signupConfirm" required placeholder="Repeat password">
            </div>
            
            <button type="submit" class="btn-primary" id="signupBtn">
                Create Account
            </button>
        </form>
        
        <div class="divider">
            <span>OR</span>
        </div>
        
        <button type="button" class="btn-google" onclick="signInWithGoogle()" id="googleBtn">
            <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign up with Google
        </button>
        
        <div class="auth-footer">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        function handleSignup(event) {
            event.preventDefault();
            
            const btn = document.getElementById('signupBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const phone = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            errorMsg.style.display = 'none';
            
            // Validation
            if (!name || !email || !phone || !password) {
                errorText.textContent = 'Please fill in all required fields';
                errorMsg.style.display = 'flex';
                return;
            }
            
            if (password !== confirm) {
                errorText.textContent = 'Passwords do not match';
                errorMsg.style.display = 'flex';
                return;
            }
            
            if (password.length < 6) {
                errorText.textContent = 'Password must be at least 6 characters';
                errorMsg.style.display = 'flex';
                return;
            }
            
            // Validate phone format
            if (!/^[0-9]{10}$/.test(phone.replace(/[^\d]/g, ''))) {
                errorText.textContent = 'Phone must be 10 digits (e.g., 0712345678)';
                errorMsg.style.display = 'flex';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';
            
            // Create user
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    // Update profile with name
                    return user.updateProfile({
                        displayName: name
                    }).then(() => {
                        // Save to Firebase database with phone number
                        return database.ref('users/' + user.uid).set({
                            name: name,
                            email: email,
                            phone: phone,  // IMPORTANT: Store phone number
                            createdAt: new Date().toISOString(),
                            lastLogin: new Date().toISOString(),
                            accountStatus: 'active'
                        });
                    });
                })
                .then(() => {
                    console.log('✅ Account created successfully');
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error('Signup error:', error);
                    let message = window.handleFirebaseError(error);
                    
                    errorText.textContent = message;
                    errorMsg.style.display = 'flex';
                    btn.disabled = false;
                    btn.innerHTML = 'Create Account';
                });
        }
        
        function signInWithGoogle() {
            const btn = document.getElementById('googleBtn');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Connecting...';
            errorMsg.style.display = 'none';
            
            const provider = new firebase.auth.GoogleAuthProvider();
            
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    console.log('✅ Google sign-in successful:', user.email);
                    
                    // Save to database (Google auth may not have phone, ask user to add it)
                    return database.ref('users/' + user.uid).set({
                        name: user.displayName || '',
                        email: user.email,
                        photoURL: user.photoURL || '',
                        phone: user.phoneNumber || '',  // Google may have phone number
                        lastLogin: new Date().toISOString(),
                        createdAt: new Date().toISOString(),
                        accountStatus: 'active',
                        authMethod: 'google'
                    });
                })
                .then(() => {
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error('Google signup error:', error);
                    let message = window.handleFirebaseError(error);
                    
                    errorText.textContent = message;
                    errorMsg.style.display = 'flex';
                    btn.disabled = false;
                    btn.innerHTML = `
                        <svg viewBox="0 0 24 24" style="width:18px;height:18px;">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Sign up with Google
                    `;
                });
        }
    </script>
</body>
</html>
