<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Regal Aqua</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="storage-encryption.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-config.js"></script>
    <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0a1628 0%, #0f1f3d 50%, #1a2d4d 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                color: #e0e0e0;
            }

            .auth-container {
                width: 100%;
                max-width: 480px;
                background: linear-gradient(145deg, #0f1f3d 0%, #1a2d4d 100%);
                border: 1px solid rgba(212, 175, 55, 0.3);
                border-radius: 24px;
                padding: 48px 40px;
                box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.1);
                position: relative;
                overflow: hidden;
            }

            .auth-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, #D4AF37, #F4E5C2, #D4AF37);
            }

            .auth-logo {
                text-align: center;
                margin-bottom: 32px;
            }

            .auth-logo img {
                height: 64px;
                width: auto;
                filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.3));
            }

            .auth-logo h1 {
                color: #D4AF37;
                font-size: 28px;
                font-weight: 700;
                margin-top: 16px;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            .auth-logo p {
                color: #8892b0;
                font-size: 14px;
                margin-top: 8px;
            }

            .auth-title {
                color: #D4AF37;
                font-size: 24px;
                font-weight: 700;
                text-align: center;
                margin-bottom: 8px;
            }

            .auth-subtitle {
                color: #8892b0;
                text-align: center;
                font-size: 14px;
                margin-bottom: 32px;
            }

            .form-group {
                margin-bottom: 24px;
                position: relative;
            }

            .form-group label {
                display: block;
                color: #D4AF37;
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 8px;
            }

            .input-wrapper {
                position: relative;
            }

            .input-icon {
                position: absolute;
                left: 16px;
                top: 50%;
                transform: translateY(-50%);
                color: #D4AF37;
                opacity: 0.6;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .form-group input:focus ~ .input-icon,
            .form-group input:not(:placeholder-shown) ~ .input-icon {
                opacity: 1;
            }

            .form-group input {
                width: 100%;
                padding: 14px 16px 14px 48px;
                background: rgba(255, 255, 255, 0.05);
                border: 1.5px solid rgba(212, 175, 55, 0.2);
                border-radius: 12px;
                color: #e0e0e0;
                font-size: 15px;
                transition: all 0.3s ease;
                outline: none;
            }

            .form-group input::placeholder {
                color: #8892b0;
                opacity: 0.6;
            }

            .form-group input:focus {
                border-color: #D4AF37;
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
                background: rgba(255, 255, 255, 0.08);
            }

            .password-field {
                position: relative;
            }

            .password-toggle {
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: #D4AF37;
                cursor: pointer;
                opacity: 0.6;
                transition: opacity 0.3s ease;
                padding: 4px;
            }

            .password-toggle:hover {
                opacity: 1;
            }

            .password-hint {
                font-size: 12px;
                color: #8892b0;
                margin-top: 6px;
                display: flex;
                align-items: center;
                gap: 6px;
            }

            .password-hint svg {
                width: 14px;
                height: 14px;
                color: #D4AF37;
                opacity: 0.7;
            }

            .btn-auth {
                width: 100%;
                padding: 16px;
                background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%);
                color: #0a1628;
                border: none;
                border-radius: 12px;
                font-weight: 700;
                font-size: 16px;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-top: 8px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                position: relative;
                overflow: hidden;
            }

            .btn-auth::after {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
                transition: left 0.5s ease;
            }

            .btn-auth:hover::after {
                left: 100%;
            }

            .btn-auth:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            }

            .btn-auth:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            .auth-divider {
                display: flex;
                align-items: center;
                margin: 28px 0;
                color: #8892b0;
                font-size: 13px;
            }

            .auth-divider::before,
            .auth-divider::after {
                content: '';
                flex: 1;
                height: 1px;
                background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
            }

            .auth-divider span {
                padding: 0 16px;
            }

            .btn-google {
                width: 100%;
                padding: 14px;
                background: rgba(255, 255, 255, 0.05);
                border: 1.5px solid rgba(212, 175, 55, 0.3);
                border-radius: 12px;
                color: #e0e0e0;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-size: 15px;
                font-weight: 500;
                transition: all 0.3s ease;
            }

            .btn-google:hover {
                background: rgba(212, 175, 55, 0.1);
                border-color: rgba(212, 175, 55, 0.5);
                transform: translateY(-1px);
            }

            .google-icon {
                width: 20px;
                height: 20px;
            }

            .auth-footer {
                text-align: center;
                margin-top: 28px;
                color: #8892b0;
                font-size: 14px;
            }

            .auth-footer a {
                color: #D4AF37;
                text-decoration: none;
                font-weight: 600;
                transition: color 0.3s ease;
            }

            .auth-footer a:hover {
                color: #F4E5C2;
                text-decoration: underline;
            }

            .error-message {
                background: rgba(239, 68, 68, 0.1);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #ef4444;
                padding: 12px 16px;
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 14px;
                display: none;
                align-items: center;
                gap: 8px;
            }

            .error-message svg {
                width: 18px;
                height: 18px;
                flex-shrink: 0;
            }

            .loading-spinner {
                display: inline-block;
                width: 20px;
                height: 20px;
                border: 2px solid #0a1628;
                border-top-color: transparent;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-right: 8px;
                vertical-align: middle;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            .back-link {
                position: absolute;
                top: 24px;
                left: 24px;
                color: #8892b0;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px;
                transition: color 0.3s ease;
            }

            .back-link:hover {
                color: #D4AF37;
            }

            .back-link svg {
                width: 18px;
                height: 18px;
            }

            .terms-group {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                margin-bottom: 24px;
            }

            .terms-group input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #D4AF37;
                margin-top: 2px;
                cursor: pointer;
            }

            .terms-group label {
                color: #8892b0;
                font-size: 13px;
                line-height: 1.5;
                cursor: pointer;
            }

            .terms-group label a {
                color: #D4AF37;
                text-decoration: none;
            }

            .terms-group label a:hover {
                text-decoration: underline;
            }

            @media (max-width: 480px) {
                .auth-container {
                    padding: 32px 24px;
                    border-radius: 20px;
                }
            
                .auth-logo h1 {
                    font-size: 24px;
                }
            
                .auth-title {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="auth-container">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Home
            </a>

            <div class="auth-logo">
                <img src="assets/images/logo.png" alt="Regal Aqua" onerror="this.style.display='none'; this.nextElementSibling.style.marginTop='0';">
                <h1>Regal Aqua</h1>
                <p>Premium Purified Water</p>
            </div>

            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join us for premium water delivery</p>
        
            <div class="error-message" id="errorMsg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
                <span id="errorText"></span>
            </div>
        
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="signupName" required placeholder="P.M.">
                    </div>
                </div>
            
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="signupEmail" required placeholder="your@email.com">
                    </div>
                </div>
            
                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <input type="tel" id="signupPhone" placeholder="0712345678" required>
                    </div>
                </div>
            
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper password-field">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="signupPassword" required placeholder="Min 8 chars, Aa1!" minlength="8">
                        <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1">
                            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div class="password-hint">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        Use 8+ characters with uppercase, lowercase, number, and symbol
                    </div>
                </div>
            
                <div class="form-group">
                    <label for="signupConfirm">Confirm Password</label>
                    <div class="input-wrapper password-field">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="signupConfirm" required placeholder="Repeat password">
                    </div>
                </div>

                <div class="terms-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>
            
                <button type="submit" class="btn-auth" id="signupBtn">
                    Create Account
                </button>
            </form>
        
            <div class="auth-divider">
                <span>OR</span>
            </div>
        
            <button class="btn-google" onclick="signInWithGoogle()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign up with Google
            </button>
        
            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in here</a>
            </div>
        </div>

        <script src="standalone-auth.js"></script>
    </body>
    </html>
